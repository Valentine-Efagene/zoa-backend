# Local AWS emulator + Mailpit for Playwright UAT (DynamoDB, S3, auth emails).
# Start: docker compose -f docker-compose.uat.yml up -d
services:
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - AWS_DEFAULT_REGION=us-east-1

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
