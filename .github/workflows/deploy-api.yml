name: Deploy API

on:
  push:
    branches: [main, master]
    paths:
      - "api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:
    inputs:
      stage:
        description: Deployment stage
        required: true
        default: prod
        type: choice
        options:
          - prod
          - dev

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-api-${{ github.event.inputs.stage || 'prod' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Serverless API
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.stage == 'dev' && 'development' || 'production' }}
    defaults:
      run:
        working-directory: api
    env:
      STAGE: ${{ github.event.inputs.stage || 'prod' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      APPLICATIONS_TABLE: ${{ vars.APPLICATIONS_TABLE }}
      DOCUMENTS_BUCKET: ${{ vars.DOCUMENTS_BUCKET }}
      COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
      COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
      CORS_ORIGIN: ${{ vars.CORS_ORIGIN || '*' }}
      EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED || 'true' }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      EMAIL_REPLY_TO: ${{ vars.EMAIL_REPLY_TO }}
      NOTIFY_ADMIN_EMAIL: ${{ vars.NOTIFY_ADMIN_EMAIL }}
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      EMAIL_TEMPLATES_TABLE: ${{ vars.EMAIL_TEMPLATES_TABLE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy
        run: npx serverless deploy --stage "$STAGE" --verbose
