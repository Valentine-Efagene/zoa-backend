name: UAT (Playwright + Floci)

on:
  push:
    branches: [main, dev]
    paths:
      - "api/**"
      - "web/**"
      - "scripts/uat/**"
      - "docker-compose.uat.yml"
      - ".github/workflows/uat.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "api/**"
      - "web/**"
      - "scripts/uat/**"
      - "docker-compose.uat.yml"
      - ".github/workflows/uat.yml"
  workflow_dispatch:

concurrency:
  group: uat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uat:
    name: Playwright registration UAT
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Floci
        run: docker compose -f docker-compose.uat.yml up -d

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json

      - name: Prepare UAT env files
        run: |
          cp api/.env.uat.example api/.env.uat
          cp web/.env.uat.example web/.env.uat

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run UAT
        working-directory: web
        env:
          CI: "true"
          AWS_ACCOUNT_ID: "000000000000"
        run: npm run test:uat

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
