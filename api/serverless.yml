service: zoa-api

frameworkVersion: "3"

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  memorySize: 256
  timeout: 29
  architecture: arm64
  environment:
    STAGE: ${self:provider.stage}
    APPLICATIONS_TABLE: ${env:APPLICATIONS_TABLE, 'zoa-applications-${self:provider.stage}'}
    DOCUMENTS_BUCKET: ${env:DOCUMENTS_BUCKET, ''}
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID, ''}
    COGNITO_CLIENT_ID: ${env:COGNITO_CLIENT_ID, ''}
    CORS_ORIGIN: ${env:CORS_ORIGIN, '*'}
  httpApi:
    cors:
      allowedOrigins:
        - http://localhost:3000
        - http://localhost:3001
        - http://localhost:3002
        - http://localhost:3003
        - http://127.0.0.1:3000
        - http://127.0.0.1:3001
        - http://127.0.0.1:3002
        - http://127.0.0.1:3003
        - https://zoa-dq83.vercel.app
        - https://zoa-theta.vercel.app
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PATCH
        - DELETE
        - OPTIONS
      allowCredentials: true
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:provider.environment.APPLICATIONS_TABLE}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:provider.environment.APPLICATIONS_TABLE}/index/*
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
            - s3:HeadObject
          Resource:
            - arn:aws:s3:::${self:provider.environment.DOCUMENTS_BUCKET}/*

plugins:
  - serverless-esbuild
  - serverless-offline

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node20
    platform: node
    concurrency: 10
    packager: npm
    exclude:
      - '@aws-sdk/*'
  serverless-offline:
    httpPort: 4000

functions:
  health:
    handler: src/handlers/health.handler
    events:
      - httpApi:
          path: /health
          method: GET

  listApplications:
    handler: src/handlers/applications.list
    events:
      - httpApi:
          path: /applications
          method: GET

  createApplication:
    handler: src/handlers/applications.create
    events:
      - httpApi:
          path: /applications
          method: POST

  getApplication:
    handler: src/handlers/applications.get
    events:
      - httpApi:
          path: /applications/{id}
          method: GET

  updateApplication:
    handler: src/handlers/applications.update
    events:
      - httpApi:
          path: /applications/{id}
          method: PATCH

  adminListApplications:
    handler: src/handlers/applications.adminList
    events:
      - httpApi:
          path: /admin/applications
          method: GET

  adminGetApplication:
    handler: src/handlers/applications.adminGet
    events:
      - httpApi:
          path: /admin/applications/{id}
          method: GET

  adminUpdateApplication:
    handler: src/handlers/applications.adminUpdate
    events:
      - httpApi:
          path: /admin/applications/{id}
          method: PATCH

  createUploadUrl:
    handler: src/handlers/documents.createUploadUrl
    events:
      - httpApi:
          path: /applications/{id}/documents/upload-url
          method: POST

  createDownloadUrl:
    handler: src/handlers/documents.createDownloadUrl
    events:
      - httpApi:
          path: /applications/{id}/documents/{documentId}/download-url
          method: GET

  listWorkflows:
    handler: src/handlers/workflows.list
    events:
      - httpApi:
          path: /workflows
          method: GET

  getWorkflow:
    handler: src/handlers/workflows.get
    events:
      - httpApi:
          path: /workflows/{slug}
          method: GET

package:
  individually: true
